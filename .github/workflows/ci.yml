name: ci

# The same gates the pipeline runs, run somewhere other than one laptop.
# Before this existed, main was green on trust.
on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # One Node version failing should not hide the other's result.
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, and the version
        # development actually happens on.
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Biome then TypeScript — the same command lightsout.config.json points
      # its `check` gate at.
      - run: pnpm check

      # Runs the unit suite AND the 95% coverage thresholds declared in
      # tests/config/jest.config.cjs. No git identity setup is needed: the
      # helpers that build throwaway repos pass their own with `git -c`.
      - run: pnpm test:unit:coverage

      - run: pnpm test:e2e

  shipped:
    name: plugin is shippable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version comparison needs the base branch's history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # scripts/checkShipped.mjs is the only definition of what "shippable"
      # means: the engine bundle matches src/, the standards copy matches
      # standards/, and plugin.json carries a new version when either moved.
      # The pre-push hook runs this same file, so a local pass and a CI pass
      # cannot mean different things.
      #
      # On a pull request the base is the branch being merged into. On a push
      # to main there is nothing to bump against, and the script says so and
      # skips that third question rather than inventing an answer.
      - name: Check that plugin/ is shippable
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE" ]; then
            git fetch --no-tags origin "$BASE"
            node scripts/checkShipped.mjs --base FETCH_HEAD
          else
            node scripts/checkShipped.mjs --base HEAD
          fi

  release:
    name: tag and release
    if: github.event_name == 'push'
    needs: [verify, shipped]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The tag follows the version rather than leading it, so the release notes
      # describe a build that already passed every gate above.
      - name: Release when the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./plugin/.claude-plugin/plugin.json').version")
          tag="v$version"

          # Asked over the API rather than from local tags, so a shallow
          # checkout still gets a truthful answer.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released — nothing to do."
            exit 0
          fi

          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
