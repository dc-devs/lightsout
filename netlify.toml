# The public lightsout site: the web app's public pages, served by Netlify.
#
# Netlify builds from its own Git link to this repository — nothing in CI
# deploys it. `@netlify/vite-plugin-tanstack-start` (enabled in
# packages/web-app/vite.config.ts only when Netlify sets NETLIFY) turns the
# server build into Netlify Functions under packages/web-app/.netlify/, which is
# why the base is the app's package rather than the repository root.

[build]
  base = "packages/web-app"
  publish = "dist/client"
  command = "pnpm run build"

[build.environment]
  # The public site: `/app` does not exist and nothing links to it. The build
  # checks the value and bakes it into the bundle, because variables set here
  # reach the build and never the functions at run time.
  LIGHTSOUT_PUBLIC = "1"
  # Netlify reads .nvmrc from the base directory, and ours sits at the repository
  # root, so the major version is stated here. Keep it on the major .nvmrc pins.
  NODE_VERSION = "24"
